apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oya-browser

resources:
- ../../base
- ingress.yaml
- cert.yaml

replicas:
- name: browser
  count: 3

images:
- name: ghcr.io/oyadotai/oya-browser-server
  newTag: latest
- name: ghcr.io/oyadotai/oya-browser
  newTag: latest

labels:
  - pairs:
      app.kubernetes.io/version: prod
    includeSelectors: false
