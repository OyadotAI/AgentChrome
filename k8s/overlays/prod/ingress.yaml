# Ingress for Oya Browser Server
# WebSocket: wss://browser.oya.ai/ws
# MCP:       https://browser.oya.ai/mcp/:id
# Dashboard: https://browser.oya.ai/
# Live view: https://browser.oya.ai/live/:id
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oya-browser
  namespace: oya-browser
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Long timeouts for WebSocket + MCP streaming
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Sticky sessions — browser WS must stay on same pod
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "oya-browser-route"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "10800"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
    # CORS — browsers and MCP clients connect from various origins
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET,POST,PUT,DELETE,OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - browser.oya.ai
    secretName: oya-browser-cert
  rules:
  - host: browser.oya.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: server
            port:
              number: 3100
