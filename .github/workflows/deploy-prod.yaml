name: Deploy Prod (browser.getoya.ai)

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_SERVER: ghcr.io/oyadotai/oya-browser-server
  IMAGE_BROWSER: ghcr.io/oyadotai/oya-browser
  NAMESPACE: oya-browser

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install browser dependencies
      run: cd browser && npm ci

    - name: Build Linux AppImage
      run: cd browser && npm run dist:linux

    - name: Upload AppImage as artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-appimage
        path: browser/dist/*.AppImage

    - name: Upload to GitHub release
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        SRC="browser/dist/Oya Browser-${VERSION}-arm64.AppImage"
        DST="Oya.Browser-${VERSION}-arm64.AppImage"
        FOUND="$SRC"
        if [ ! -f "$FOUND" ]; then
          FOUND=$(ls browser/dist/*.AppImage 2>/dev/null | head -1)
        fi
        if [ -n "$FOUND" ] && [ -f "$FOUND" ]; then
          cp "$FOUND" "$DST"
          gh release upload "${GITHUB_REF_NAME}" "$DST" --clobber
          echo "Uploaded $DST to release ${GITHUB_REF_NAME}"
        else
          echo "WARNING: No AppImage found, skipping upload"
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-image:
    name: Build & push Docker image
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download browser binaries from release
      run: |
        mkdir -p server/downloads
        # macOS DMG (uploaded by release script)
        gh release download ${{ github.ref_name }} --pattern '*.dmg' --dir server/downloads --clobber || true
        # Linux AppImage (uploaded by build-linux job above)
        gh release download ${{ github.ref_name }} --pattern '*.AppImage' --dir server/downloads --clobber || true
        # Rename space to dot if needed
        cd server/downloads
        for f in *" "*; do [ -f "$f" ] && mv "$f" "$(echo "$f" | tr ' ' '.')" 2>/dev/null; done || true
        ls -lh server/downloads/ || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update download URLs in UI
      run: |
        VERSION="${{ github.ref_name }}"
        VERSION="${VERSION#v}"
        echo "Updating download links to version $VERSION"
        sed -i "s/Oya\.Browser-[0-9]*\.[0-9]*\.[0-9]*-/Oya.Browser-${VERSION}-/g" ui/src/app/page.tsx
        grep -o 'Oya\.Browser-[0-9]*\.[0-9]*\.[0-9]*' ui/src/app/page.tsx | head -2

    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE_SERVER }}:${{ github.ref_name }}
          ${{ env.IMAGE_SERVER }}:latest
        platforms: linux/amd64
        cache-from: type=gha,scope=server-prod
        cache-to: type=gha,mode=max,scope=server-prod

  build-browser:
    name: Build & push browser image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: browser
        push: true
        tags: |
          ${{ env.IMAGE_BROWSER }}:${{ github.ref_name }}
          ${{ env.IMAGE_BROWSER }}:latest
        platforms: linux/amd64
        cache-from: type=gha,scope=browser-prod
        cache-to: type=gha,mode=max,scope=browser-prod

  deploy:
    name: Deploy to GKE (prod)
    needs: [build-image, build-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GKE_SA_KEY }}

    - uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ secrets.GKE_CLUSTER }}
        location: ${{ secrets.GKE_ZONE }}
        project_id: ${{ secrets.GKE_PROJECT }}

    - name: Create namespace
      run: kubectl create namespace ${{ env.NAMESPACE }} 2>/dev/null || true

    - name: Apply secrets
      run: |
        kubectl create secret generic app-secrets \
          --from-literal=API_KEYS="${{ secrets.API_KEYS }}" \
          --from-literal=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
          --from-literal=SUPABASE_SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}" \
          -n ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Create GHCR pull secret
      run: |
        kubectl delete secret ghcr-oyadotai -n ${{ env.NAMESPACE }} 2>/dev/null || true
        kubectl create secret docker-registry ghcr-oyadotai \
          --docker-server=ghcr.io \
          --docker-username=${{ github.repository_owner }} \
          --docker-password=${{ secrets.GHCR_PAT }} \
          -n ${{ env.NAMESPACE }}

    - name: Deploy with Kustomize
      run: kubectl apply -k k8s/overlays/prod

    - name: Rolling restart
      run: |
        kubectl patch deployment server -n ${{ env.NAMESPACE }} \
          -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"rollout\":\"$(date +%s)\"}}}}}" || true
        kubectl patch deployment browser -n ${{ env.NAMESPACE }} \
          -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"rollout\":\"$(date +%s)\"}}}}}" || true

    - name: Wait for rollout
      # No `|| true` — a stuck rollout (ImagePullBackOff, unschedulable) must
      # fail the job instead of reporting a green deploy that never landed.
      run: |
        kubectl rollout status deployment/server -n ${{ env.NAMESPACE }} --timeout=180s
        kubectl rollout status deployment/browser -n ${{ env.NAMESPACE }} --timeout=180s

    - name: Diagnose failed rollout
      if: failure()
      run: |
        kubectl get pods -n ${{ env.NAMESPACE }}
        kubectl get events -n ${{ env.NAMESPACE }} --field-selector type=Warning \
          --sort-by=.lastTimestamp | tail -20

    - name: Show status
      if: always()
      run: kubectl get pods,svc,ingress -n ${{ env.NAMESPACE }}
