name: Deploy Dev (dev-browser.getoya.ai)

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_SERVER: ghcr.io/oyadotai/oya-browser-server
  IMAGE_BROWSER: ghcr.io/oyadotai/oya-browser
  TAG: dev
  NAMESPACE: oya-browser-dev

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      browser: ${{ steps.filter.outputs.browser }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          server:
            - 'server/**'
            - 'ui/**'
            - 'browser/scripts/**'
            - 'Dockerfile'
          browser:
            - 'browser/**'
          k8s:
            - 'k8s/**'

  build:
    name: Build & push image
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download browser binaries from latest release
      run: |
        mkdir -p server/downloads
        LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
        echo "Downloading binaries from release $LATEST_TAG"
        gh release download "$LATEST_TAG" --pattern '*.dmg' --dir server/downloads --clobber || true
        gh release download "$LATEST_TAG" --pattern '*.AppImage' --dir server/downloads --clobber || true
        ls -lh server/downloads/ || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update download URLs in UI
      run: |
        LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
        VERSION="${LATEST_TAG#v}"
        echo "Updating download links to version $VERSION"
        sed -i "s/Oya\.Browser-[0-9]*\.[0-9]*\.[0-9]*-/Oya.Browser-${VERSION}-/g" ui/src/app/page.tsx
        grep -o 'Oya\.Browser-[0-9]*\.[0-9]*\.[0-9]*' ui/src/app/page.tsx | head -2
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ env.IMAGE_SERVER }}:${{ env.TAG }}
        platforms: linux/amd64
        cache-from: type=gha,scope=server-dev
        cache-to: type=gha,mode=max,scope=server-dev

  build-browser:
    name: Build & push browser image
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: browser
        push: true
        tags: ${{ env.IMAGE_BROWSER }}:${{ env.TAG }}
        platforms: linux/amd64
        cache-from: type=gha,scope=browser-dev
        cache-to: type=gha,mode=max,scope=browser-dev

  deploy:
    name: Deploy to GKE (dev)
    needs: [changes, build, build-browser]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GKE_SA_KEY }}

    - uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ secrets.GKE_CLUSTER }}
        location: ${{ secrets.GKE_ZONE }}
        project_id: ${{ secrets.GKE_PROJECT }}

    - name: Create namespace
      run: kubectl create namespace ${{ env.NAMESPACE }} 2>/dev/null || true

    - name: Apply secrets
      run: |
        kubectl create secret generic app-secrets \
          --from-literal=API_KEYS="${{ secrets.API_KEYS }}" \
          --from-literal=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
          --from-literal=SUPABASE_SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}" \
          -n ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Create GHCR pull secret
      run: |
        kubectl delete secret ghcr-oyadotai -n ${{ env.NAMESPACE }} 2>/dev/null || true
        kubectl create secret docker-registry ghcr-oyadotai \
          --docker-server=ghcr.io \
          --docker-username=${{ github.repository_owner }} \
          --docker-password=${{ secrets.GHCR_PAT }} \
          -n ${{ env.NAMESPACE }}

    - name: Deploy with Kustomize
      run: kubectl apply -k k8s/overlays/dev

    - name: Rolling restart server
      if: needs.changes.outputs.server == 'true' || needs.changes.outputs.k8s == 'true'
      run: |
        kubectl patch deployment server -n ${{ env.NAMESPACE }} \
          -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"rollout\":\"$(date +%s)\"}}}}}" || true

    - name: Rolling restart browser
      if: needs.changes.outputs.browser == 'true' || needs.changes.outputs.k8s == 'true'
      run: |
        kubectl patch deployment browser -n ${{ env.NAMESPACE }} \
          -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"rollout\":\"$(date +%s)\"}}}}}" || true

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/server -n ${{ env.NAMESPACE }} --timeout=120s || true
        kubectl rollout status deployment/browser -n ${{ env.NAMESPACE }} --timeout=120s || true

    - name: Show status
      if: always()
      run: kubectl get pods,svc,ingress -n ${{ env.NAMESPACE }}
