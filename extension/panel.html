<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-card: #141414;
      --bg-input: #1a1a1a;
      --border: #262626;
      --border-focus: #404040;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --text-dim: #52525b;
      --accent: #c8ff00;
      --green: #22c55e;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px; color: var(--text); background: var(--bg);
      height: 100vh; display: flex; flex-direction: column;
    }

    /* Header */
    .header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 6px var(--accent);
    }
    .header-title { font-size: 13px; font-weight: 600; }
    .header-status {
      margin-left: auto; font-size: 10px; font-weight: 600;
      padding: 2px 7px; border-radius: 6px;
    }
    .header-status.on { background: rgba(34,197,94,0.12); color: var(--green); }
    .header-status.off { background: rgba(239,68,68,0.12); color: var(--red); }

    /* Tab bar */
    .tabs {
      display: flex; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab {
      flex: 1; padding: 8px 0; border: none; background: none;
      color: var(--text-dim); font-size: 11px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      border-bottom: 2px solid transparent; transition: all 0.15s;
    }
    .tab:hover { color: var(--text-muted); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Panels */
    .panel { display: none; flex: 1; overflow-y: auto; }
    .panel.active { display: flex; flex-direction: column; }

    /* Actions */
    .action-group {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
    }
    .action-group-title {
      font-size: 10px; font-weight: 600; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
    }
    .action-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .action-btn {
      padding: 6px 12px; border-radius: 6px;
      background: var(--bg-input); border: 1px solid var(--border);
      color: var(--text-muted); font-size: 11px; font-weight: 500;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .action-btn:hover { border-color: var(--border-focus); color: var(--text); }
    .action-btn:active { background: var(--border); }
    .action-btn.primary {
      background: rgba(200,255,0,0.08); border-color: rgba(200,255,0,0.2);
      color: var(--accent);
    }
    .action-btn.primary:hover { background: rgba(200,255,0,0.12); }

    .action-input-row { display: flex; gap: 6px; margin-top: 6px; }
    .action-input {
      flex: 1; padding: 6px 10px; background: var(--bg-input);
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: 12px; font-family: inherit; outline: none;
    }
    .action-input:focus { border-color: var(--border-focus); }
    .action-input::placeholder { color: var(--text-dim); }

    /* Source view */
    .source-view {
      flex: 1; padding: 12px 16px; overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px; line-height: 1.6; color: var(--text-muted);
      white-space: pre-wrap; word-break: break-word;
    }
    .source-view:empty::before {
      content: 'Click "Analyze" to see the page as AI sees it.';
      color: var(--text-dim); font-style: italic;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Results */
    .result-area {
      padding: 12px 16px; border-top: 1px solid var(--border);
      max-height: 200px; overflow-y: auto;
      font-family: ui-monospace, monospace; font-size: 11px;
      color: var(--text-dim); line-height: 1.5;
    }
    .result-area:empty { display: none; }
    .result-ok { color: var(--green); }
    .result-err { color: var(--red); }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-dot"></div>
    <div class="header-title">Oya Browser</div>
    <div class="header-status off" id="panel-status">offline</div>
  </div>

  <!-- Tab bar -->
  <div class="tabs">
    <button class="tab active" data-panel="actions">Actions</button>
    <button class="tab" data-panel="source">Source</button>
  </div>

  <!-- Actions Panel -->
  <div class="panel active" id="panel-actions">
    <div class="action-group">
      <div class="action-group-title">Page</div>
      <div class="action-row">
        <button class="action-btn primary" id="btn-analyze">Analyze</button>
        <button class="action-btn" id="btn-screenshot">Screenshot</button>
        <button class="action-btn" id="btn-scroll-down">Scroll Down</button>
        <button class="action-btn" id="btn-scroll-up">Scroll Up</button>
      </div>
    </div>

    <div class="action-group">
      <div class="action-group-title">Navigate</div>
      <div class="action-input-row">
        <input type="text" class="action-input" id="nav-url" placeholder="URL...">
        <button class="action-btn" id="btn-navigate">Go</button>
      </div>
    </div>

    <div class="action-group">
      <div class="action-group-title">Click / Type</div>
      <div class="action-input-row">
        <input type="number" class="action-input" id="element-id" placeholder="Element #" style="width:80px;flex:none;">
        <button class="action-btn" id="btn-click">Click</button>
        <button class="action-btn" id="btn-hover">Hover</button>
      </div>
      <div class="action-input-row">
        <input type="number" class="action-input" id="type-element-id" placeholder="#" style="width:60px;flex:none;">
        <input type="text" class="action-input" id="type-text" placeholder="Text to type...">
        <button class="action-btn" id="btn-type">Type</button>
      </div>
    </div>

    <div class="action-group">
      <div class="action-group-title">Key Press</div>
      <div class="action-row">
        <button class="action-btn" data-key="Enter">Enter</button>
        <button class="action-btn" data-key="Escape">Esc</button>
        <button class="action-btn" data-key="Tab">Tab</button>
        <button class="action-btn" data-key="ArrowDown">Down</button>
        <button class="action-btn" data-key="ArrowUp">Up</button>
        <button class="action-btn" data-key="Backspace">Bksp</button>
      </div>
    </div>

    <div id="action-result" class="result-area"></div>
  </div>

  <!-- Source Panel -->
  <div class="panel" id="panel-source">
    <div class="source-view" id="source-content"></div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
