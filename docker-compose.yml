services:
  server:
    build: .
    ports:
      - "${PORT:-3100}:3100"
    environment:
      - PORT=3100
      - API_KEYS=${API_KEYS:-}
    restart: unless-stopped

  browser:
    build: browser
    environment:
      - OYA_SERVER_URL=ws://server:3100/ws
      - OYA_API_KEY=${API_KEYS:-}
      - OYA_AUTO_CONNECT=true
      - OYA_BROWSER_NAME=${BROWSER_NAME:-Oya Browser Docker}
      - SCREEN_WIDTH=${SCREEN_WIDTH:-1920}
      - SCREEN_HEIGHT=${SCREEN_HEIGHT:-1080}
      - VNC_ENABLED=${VNC_ENABLED:-false}
      - VNC_PORT=5900
    ports:
      - "${VNC_PORT:-5900}:5900"
    depends_on:
      - server
    shm_size: '2gb'
    restart: unless-stopped
